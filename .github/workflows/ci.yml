name: Native CLI

on:
  push:
    branches: [main, xrdfs, xrdfs-epel]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Lint the distributed implementation
        run: |
          ruff check \
            src/gfal/__init__.py \
            src/gfal/xrdfs.py \
            src/gfal/xrdcp.py \
            src/gfal/cli/completion.py \
            src/gfal/cli/cp.py \
            src/gfal/cli/local.py \
            src/gfal/cli/main.py \
            src/gfal/cli/save.py \
            src/gfal/cli/transfer.py \
            src/gfal/cli/xrdfs.py \
            tests/test_cp_native.py \
            tests/test_local_cli.py \
            tests/test_packaging_metadata.py \
            tests/test_save_native.py \
            tests/test_xrdfs_cli.py
      - name: Run native CLI tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q -o addopts='' \
            tests/test_cp_native.py \
            tests/test_local_cli.py \
            tests/test_packaging_metadata.py \
            tests/test_save_native.py \
            tests/test_xrdfs_cli.py

  wheel:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build hatchling hatch-vcs
      - name: Build and verify distributions
        run: |
          make dist
          python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

  rpm:
    name: RPM EL${{ matrix.el }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - el: 9
            image: almalinux:9
          - el: 10
            image: almalinux:10-kitten
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build with EPEL packages only
        env:
          IMAGE: ${{ matrix.image }}
          PRETEND_VERSION: 0.1.64.dev${{ github.run_number }}
        run: |
          docker run --rm \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="$PRETEND_VERSION" \
            -v "$PWD:/src" -w /src "$IMAGE" bash -lc '
              set -e
              dnf -y install epel-release dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf -y install \
                make pyproject-rpm-macros python3-build python3-devel \
                python3-hatch-vcs python3-hatchling rpm-build \
                xrdcl-http xrootd-client
              make rpm
            '
      - name: Install in a clean EL container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/rpmbuild/RPMS/noarch:/rpms:ro" "$IMAGE" bash -lc '
              set -e
              dnf -y install epel-release dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf -y install /rpms/python3-gfal-*.rpm
              gfal --version
              gfal completion bash >/dev/null
              python3 - <<"PY"
          import importlib.util

          for name in ("aiohttp", "click", "fsspec", "rich", "XRootD"):
              assert importlib.util.find_spec(name) is None, name
          PY
            '
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-el${{ matrix.el }}
          path: |
            rpmbuild/RPMS/noarch/*.rpm
            rpmbuild/SRPMS/*.rpm
