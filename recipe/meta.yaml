{% set version = os.environ.get("PKG_VERSION") or "0.0.0" %}

package:
  name: gfal
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  script_env:
    - PKG_VERSION
    - SETUPTOOLS_SCM_PRETEND_VERSION
  entry_points:
    - gfal = gfal.cli.main:main

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python >=3.9
  run:
    - python >=3.9
    - xrootd

test:
  imports:
    - gfal
  commands:
    - gfal --help
    - python -c "import gfal"
  requires:
    - pip

about:
  home: https://github.com/lobis/gfal
  summary: GFAL-compatible command-line tools backed by XRootD clients
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/lobis/gfal
  doc_url: https://lobis.github.io/gfal/

extra:
  recipe-maintainers:
    - lobis
