[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gfal"
dynamic = ["version"]
description = "GFAL-compatible command-line tools backed by XRootD clients"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Luis Antonio Obis Aparicio", email = "luis.obis@cern.ch" },
]
dependencies = []

[project.scripts]
gfal = "gfal.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.2.0",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=16.0.1",
    "codespell>=2.4.2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = [
    "src/gfal/core/**",
    "src/gfal/cli/base.py",
    "src/gfal/cli/commands.py",
    "src/gfal/cli/copy.py",
    "src/gfal/cli/ls.py",
    "src/gfal/cli/mount.py",
    "src/gfal/cli/progress.py",
    "src/gfal/cli/rm.py",
    "src/gfal/cli/shell.py",
    "src/gfal/cli/tape.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gfal"]

[tool.hatch.build.hooks.vcs]
version-file = "src/gfal/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --dist loadgroup"
markers = [
    "integration: tests that require network access to external services",
    "network: tests that make real network calls (retried automatically on failure)",
    "mount: tests that require FUSE mounting support",
    "xrootd: tests that require a local XRootD server (started automatically by the fixture)",
    "xdist_group(name): keep related tests on the same xdist worker",
    "sftp: tests that require a local SFTP server (started automatically by the fixture)",
    "s3: tests that require a local S3-compatible server (started automatically by the fixture)",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py39"
exclude = ["src/gfal/_version.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PTH", # use pathlib over os.path (advisory)
]
ignore = [
    "E501", # line too long – handled by the formatter
    "UP045", # use `X | None` for type annotations (wait: we need 3.9 support!)
]

[tool.ruff.lint.isort]
known-first-party = ["gfal"]

[tool.codespell]
skip = ".git,.venv,*.egg-info"
ignore-words-list = "cern,xrootd,fsspec,gfal,adler,aiohttp,thirdparty,scitag,moto,paramiko,cachable"
